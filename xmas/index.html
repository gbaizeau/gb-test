<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XMAS '26 Fitness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #121212; color: #ffffff; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .log-input {
            background-color: #1e1e24; border: 1px solid #333; color: white;
            text-align: center; font-weight: 700; border-radius: 0.5rem;
            padding: 0.5rem; width: 100%; transition: border-color 0.2s;
        }
        .log-input:focus { outline: none; border-color: #8b5cf6; }
        
        .nav-item.active { color: #8b5cf6; position: relative; }
        .nav-item.active::after {
            content: ''; position: absolute; bottom: -10px; left: 50%;
            transform: translateX(-50%); width: 4px; height: 4px;
            background-color: #8b5cf6; border-radius: 50%;
        }

        .exercise-card {
            background-color: #1c1c1e; border-radius: 1.5rem;
            padding: 1.25rem; margin-bottom: 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        
        .set-row {
            display: grid; grid-template-columns: 1fr 2fr 10px 2.5fr 3fr;
            align-items: center; gap: 0.5rem; margin-bottom: 0.75rem;
        }
    </style>
</head>
<body class="pb-32 relative min-h-screen">

    <!-- Top Header -->
    <header class="pt-12 pb-4 px-6 flex justify-between items-center sticky top-0 bg-[#121212]/90 backdrop-blur-md z-50">
        <h1 class="text-2xl font-black tracking-tight" id="header-title">Séance</h1>
        <div id="auth-container">
            <button id="btn-login" class="bg-violet-600 text-white px-4 py-1.5 rounded-full text-sm font-bold shadow-lg">Connexion</button>
            <div id="user-info" class="hidden flex items-center space-x-3">
                <div class="bg-violet-600/20 px-3 py-1 rounded-full border border-violet-500/30">
                    <span id="user-name" class="text-sm font-bold text-violet-400"></span>
                </div>
                <button id="btn-logout" class="text-xs text-slate-500 font-bold uppercase hover:text-white transition">Quitter</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div id="app-content" class="hidden container mx-auto px-4 space-y-6">
        
        <!-- TAB 1: WORKOUT -->
        <div id="view-workout">
            
            <!-- Navigation par Date -->
            <div class="mb-6 flex items-center justify-between bg-[#1c1c1e] p-4 rounded-2xl shadow-lg border border-[#333]">
                <button onclick="changeWorkoutDate(-1)" class="bg-[#2c2c2e] w-10 h-10 rounded-full flex items-center justify-center font-bold text-slate-300 hover:text-white transition">&larr;</button>
                <div class="text-center flex-1">
                    <h2 class="text-xl font-black text-white capitalize" id="workout-day-title">Séance du Jour</h2>
                    <p class="text-slate-400 text-xs font-medium uppercase tracking-wider mt-1" id="current-date-display">Date</p>
                </div>
                <button onclick="changeWorkoutDate(1)" class="bg-[#2c2c2e] w-10 h-10 rounded-full flex items-center justify-center font-bold text-slate-300 hover:text-white transition">&rarr;</button>
            </div>

            <div class="flex justify-center mb-6">
                <div id="workout-status-badge" class="bg-slate-800 text-slate-300 text-xs px-4 py-1.5 rounded-full font-bold shadow-md">
                    0 Exercices
                </div>
            </div>

            <!-- Liste des exercices -->
            <div id="workout-exercises-container" class="space-y-4"></div>
            
            <!-- Bloc Ajout d'Exercice -->
            <div class="mt-6 bg-[#1c1c1e] border border-[#333] p-4 rounded-2xl shadow-lg">
                <p class="text-[10px] font-bold text-slate-400 mb-3 uppercase tracking-widest pl-1">Ajouter à cette séance</p>
                <div class="flex space-x-2">
                    <select id="today-add-ex-select" class="flex-1 bg-[#121212] border border-[#333] text-white rounded-xl p-3 font-semibold outline-none text-sm focus:border-violet-500"></select>
                    <button onclick="addExerciseToWorkout()" class="bg-violet-600 text-white px-5 rounded-xl font-black text-lg shadow-lg hover:bg-violet-500 transition">+</button>
                </div>
            </div>

            <!-- Bloc Notes de Séance -->
            <div class="mt-6 bg-[#1c1c1e] border border-[#333] p-5 rounded-2xl shadow-lg">
                <p class="text-[10px] font-bold text-slate-400 mb-3 uppercase tracking-widest pl-1">📝 Notes de la séance</p>
                <textarea id="workout-notes" class="w-full bg-[#121212] border border-[#333] rounded-xl p-4 text-white text-sm font-medium focus:border-violet-500 outline-none mb-3" rows="3" placeholder="Douleurs, sensations, adaptations..."></textarea>
                <button onclick="saveWorkoutNote()" class="bg-[#2c2c2e] hover:bg-violet-600 text-violet-400 hover:text-white px-4 py-3 rounded-xl font-bold text-xs uppercase tracking-wider transition w-full border border-[#444] hover:border-violet-500">Enregistrer la note</button>
            </div>

            <!-- Validation de Séance -->
            <button id="btn-complete-workout" onclick="toggleWorkoutCompletion()" class="hidden"></button>
        </div>

        <!-- TAB 2: PLANNING -->
        <div id="view-plan" class="hidden">
            <div class="bg-[#1c1c1e] p-4 sm:p-6 rounded-[2rem] shadow-lg">
                
                <div class="flex justify-between items-center mb-6">
                    <button onclick="changeWeek(-1)" class="bg-[#2c2c2e] w-10 h-10 rounded-full flex items-center justify-center font-bold text-slate-300 hover:text-white transition">&larr;</button>
                    <h2 id="week-label" class="text-sm font-bold text-white tracking-wider">Semaine</h2>
                    <button onclick="changeWeek(1)" class="bg-[#2c2c2e] w-10 h-10 rounded-full flex items-center justify-center font-bold text-slate-300 hover:text-white transition">&rarr;</button>
                </div>

                <!-- Grille des 7 Jours -->
                <div id="week-grid" class="grid grid-cols-7 gap-1 sm:gap-2 mb-6"></div>

                <button onclick="importPartnerWorkout()" class="w-full bg-[#2c2c2e] hover:bg-emerald-600 text-emerald-400 hover:text-white px-4 py-3 rounded-xl font-bold text-xs uppercase tracking-wider transition border border-emerald-900/50 hover:border-emerald-500 mb-6 flex justify-center items-center gap-2 shadow-lg">
                    📥 Vérifier les partages reçus
                </button>

                <!-- Éditeur de jour -->
                <div id="day-editor" class="hidden bg-[#121212] border border-[#333] p-5 rounded-2xl relative">
                    <div class="flex justify-between items-center mb-4">
                        <h3 id="editor-date-label" class="text-white font-black text-lg">Lundi 12</h3>
                        <button onclick="closeDayEditor()" class="text-slate-500 font-black text-2xl hover:text-white bg-[#1c1c1e] w-8 h-8 rounded-full flex items-center justify-center pb-1">&times;</button>
                    </div>
                    
                    <!-- Nom de la séance -->
                    <div class="mb-5">
                        <input type="text" id="plan-session-name" onchange="saveSessionName()" placeholder="Nommer la séance (ex: Push Day)..." class="w-full bg-[#1c1c1e] border border-[#333] text-violet-300 font-bold rounded-xl p-3 outline-none focus:border-violet-500 text-sm">
                    </div>

                    <div class="mb-5">
                        <div id="planned-exercises-list" class="space-y-3 mb-2 min-h-[40px]"></div>
                    </div>

                    <div class="flex space-x-2 mb-6">
                        <select id="add-ex-select" class="flex-1 bg-[#1c1c1e] border border-[#333] text-white rounded-xl p-3 font-semibold outline-none text-sm focus:border-violet-500"></select>
                        <button onclick="addExerciseToPlan()" class="bg-violet-600 text-white px-5 rounded-xl font-black text-lg shadow-lg hover:bg-violet-500 transition">+</button>
                    </div>

                    <div class="border-t border-[#333] pt-5 mt-2 space-y-5">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-wider">Décaler cette séance au :</label>
                            <div class="flex space-x-2">
                                <input type="date" id="shift-date" class="flex-1 bg-[#1c1c1e] border border-[#333] text-white rounded-xl p-2 text-sm font-bold outline-none focus:border-orange-500">
                                <button onclick="shiftWorkout()" class="bg-orange-500 text-white px-4 rounded-xl font-bold text-xs uppercase tracking-wider shadow-lg hover:bg-orange-400 transition">Décaler</button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-wider">Copier depuis le :</label>
                            <div class="flex space-x-2">
                                <input type="date" id="copy-date" class="flex-1 bg-[#1c1c1e] border border-[#333] text-white rounded-xl p-2 text-sm font-bold outline-none focus:border-violet-500">
                                <button onclick="copyWorkoutPlan()" class="bg-violet-600 text-white px-4 rounded-xl font-bold text-xs uppercase tracking-wider shadow-lg hover:bg-violet-500 transition">Copier</button>
                            </div>
                        </div>
                    </div>

                    <button onclick="shareWorkoutToPartner()" class="w-full bg-violet-600/20 hover:bg-violet-600 text-violet-400 hover:text-white px-4 py-3 rounded-xl font-bold text-xs uppercase tracking-wider transition border border-violet-500/30 hover:border-violet-500 mt-5 flex justify-center items-center gap-2">
                        📤 Envoyer au partenaire
                    </button>
                </div>

            </div>
        </div>

        <!-- TAB 3: PROGRESSION -->
        <div id="view-progress" class="hidden">
            <div class="bg-[#1c1c1e] p-6 rounded-[2rem] shadow-lg mb-6">
                <h2 class="text-lg font-black text-white mb-6">Analyse de progression</h2>
                <select id="chart-exercise-select" onchange="renderChart()" class="w-full bg-[#121212] border border-[#333] text-white rounded-xl p-4 mb-8 font-semibold outline-none focus:border-violet-500"></select>
                <div style="height: 300px; width: 100%; position: relative;"><canvas id="progression-chart"></canvas></div>
            </div>

            <div class="bg-[#1c1c1e] p-6 rounded-[2rem] shadow-lg">
                <h2 class="text-lg font-black text-white mb-6">Historique des Séances</h2>
                <div id="workout-history-list" class="space-y-4"></div>
            </div>
        </div>

        <!-- TAB 4: REHAB (Mimi Only) -->
        <div id="view-rehab" class="hidden">
            <div class="bg-[#1c1c1e] p-6 rounded-[2rem] shadow-lg">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-black text-white flex items-center gap-2">🩹 Bilan Cheville</h2>
                    <span id="rehab-date-display" class="text-xs font-bold text-violet-400 bg-violet-900/30 px-2 py-1 rounded-md"></span>
                </div>
                
                <div class="bg-[#121212] border border-[#333] p-5 rounded-2xl mb-5">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Douleur au réveil (0-10)</label>
                    <div class="flex items-center gap-4">
                        <input type="range" id="pain-morning" min="0" max="10" value="0" class="flex-1 accent-emerald-500" oninput="document.getElementById('val-morning').innerText = this.value">
                        <div class="w-10 text-center text-2xl font-black text-emerald-400" id="val-morning">0</div>
                    </div>
                </div>

                <div class="bg-[#121212] border border-[#333] p-5 rounded-2xl mb-6">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Douleur en activité (0-10)</label>
                    <div class="flex items-center gap-4">
                        <input type="range" id="pain-activity" min="0" max="10" value="0" class="flex-1 accent-orange-500" oninput="document.getElementById('val-activity').innerText = this.value">
                        <div class="w-10 text-center text-2xl font-black text-orange-400" id="val-activity">0</div>
                    </div>
                </div>

                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 pl-1">Notes du jour</label>
                <textarea id="rehab-notes" class="w-full bg-[#121212] border border-[#333] rounded-2xl p-4 text-white mb-6 font-medium focus:border-violet-500 outline-none" rows="3" placeholder="Sensations, exercices effectués, gêne..."></textarea>

                <button onclick="saveRehab()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-sm transition shadow-lg shadow-emerald-900/50">Enregistrer le bilan</button>
                
                <div class="mt-8 pt-6 border-t border-[#333]">
                    <h3 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4">Derniers bilans</h3>
                    <div id="rehab-history-list" class="space-y-3"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal: Dernière Séance -->
    <div id="last-session-modal" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4">
        <div class="bg-[#1c1c1e] border border-[#333] rounded-2xl w-full max-w-sm p-6 relative shadow-2xl">
            <button onclick="closeLastSessionModal()" class="absolute top-4 right-4 text-slate-500 hover:text-white text-2xl font-black">&times;</button>
            <h3 id="modal-ls-title" class="text-white font-black text-lg mb-1 pr-6">Exercice</h3>
            <p id="modal-ls-date" class="text-violet-400 text-xs font-bold uppercase tracking-wider mb-4">Date</p>
            
            <div class="bg-[#121212] border border-[#333] rounded-xl p-4">
                <div class="grid grid-cols-3 gap-2 mb-2 pb-2 border-b border-[#333] text-[10px] font-bold text-slate-500 uppercase tracking-wider text-center">
                    <div>Set</div>
                    <div>Reps</div>
                    <div>Poids</div>
                </div>
                <div id="modal-ls-content" class="space-y-2">
                    <!-- Généré en JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 w-full bg-[#121212]/95 backdrop-blur-lg border-t border-[#222] pb-safe z-50">
        <div class="flex justify-around items-center h-20 px-2 pb-2">
            <button onclick="switchTab('workout')" id="tab-workout" class="nav-item active flex flex-col items-center p-2 w-20 transition text-slate-400">
                <span class="text-2xl mb-1">🏋️</span>
                <span class="text-[10px] font-bold uppercase tracking-wider">Séance</span>
            </button>
            <button onclick="switchTab('plan')" id="tab-plan" class="nav-item flex flex-col items-center p-2 w-20 transition text-slate-400">
                <span class="text-2xl mb-1">🗓️</span>
                <span class="text-[10px] font-bold uppercase tracking-wider">Plan</span>
            </button>
            <button onclick="switchTab('progress')" id="tab-progress" class="nav-item flex flex-col items-center p-2 w-20 transition text-slate-400">
                <span class="text-2xl mb-1">📈</span>
                <span class="text-[10px] font-bold uppercase tracking-wider">Progrès</span>
            </button>
            <button onclick="switchTab('rehab')" id="tab-rehab" class="nav-item hidden flex flex-col items-center p-2 w-20 transition text-slate-400">
                <span class="text-2xl mb-1">🩹</span>
                <span class="text-[10px] font-bold uppercase tracking-wider">Rehab</span>
            </button>
        </div>
    </nav>

                await setPersistence(auth, browserLocalPersistence);
                await signInWithPopup(auth, provider);
            } catch (error) { alert("Erreur de connexion : " + error.message); }
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                const rawName = user.displayName ? user.displayName.toLowerCase() : "";
                const cleanName = rawName.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                isMimi = cleanName.includes('mimi') || cleanName.includes('amelie'); 
                
                document.getElementById('user-name').innerText = user.displayName ? user.displayName.split(' ')[0] : "Sportif";
                document.getElementById('btn-login').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                
                if(isMimi) {
                    document.getElementById('tab-rehab').classList.remove('hidden');
                }
                
                initApp();
            } else {
                currentUser = null;
                document.getElementById('btn-login').classList.remove('hidden');
                document.getElementById('user-info').classList.add('hidden');
                document.getElementById('app-content').classList.add('hidden');
            }
        });

        window.switchTab = (tab) => {
            ['workout', 'plan', 'progress', 'rehab'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('active');
            });
            const titles = { 'workout': 'Séance', 'plan': 'Planning', 'progress': 'Statistiques', 'rehab': 'Rééducation' };
            document.getElementById('header-title').innerText = titles[tab];
            
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('active');
            if(tab === 'progress') {
                renderChart();
                renderWorkoutHistory();
            }
            if(tab === 'plan') loadWeekView();
            if(tab === 'workout') loadWorkoutForDate();
        };

        function initApp() {
            onSnapshot(collection(db, `users/${currentUser.uid}/customExercises`), (snap) => {
                customExercises = [];
                snap.forEach(doc => customExercises.push(doc.data().name));
                updateExerciseDropdowns();
            });

            onSnapshot(collection(db, `users/${currentUser.uid}/workoutNotes`), (snap) => {
                allNotes = {};
                snap.forEach(doc => { allNotes[doc.id] = doc.data().note; });
                if(!document.getElementById('view-progress').classList.contains('hidden')) renderWorkoutHistory();
                if(!document.getElementById('view-workout').classList.contains('hidden')) loadWorkoutForDate();
            });

            const logsQuery = query(collection(db, `users/${currentUser.uid}/workoutLogs`), orderBy('ts', 'desc'));
            onSnapshot(logsQuery, (snapshot) => {
                allLogs = [];
                snapshot.forEach(doc => allLogs.push({id: doc.id, ...doc.data()}));
                if(!document.getElementById('view-workout').classList.contains('hidden')) renderWorkoutCards();
                if(!document.getElementById('view-progress').classList.contains('hidden')) renderWorkoutHistory();
            });

            const rehabQuery = query(collection(db, `users/${currentUser.uid}/rehabLogs`), orderBy('ts', 'desc'));
            onSnapshot(rehabQuery, (snapshot) => {
                const rehabList = document.getElementById('rehab-history-list');
                if(!rehabList) return;
                rehabList.innerHTML = '';
                let count = 0;
                snapshot.forEach(doc => {
                    if(count > 5) return; 
                    const data = doc.data();
                    if(!data.ts) return;
                    const d = new Date(data.ts.toDate()).toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'short'});
                    rehabList.innerHTML += `
                        <div class="bg-[#1c1c1e] border border-[#333] p-4 rounded-xl relative">
                            <button onclick="deleteRehab('${doc.id}')" class="absolute top-2 right-2 w-6 h-6 flex items-center justify-center bg-[#2c2c2e] hover:bg-red-500/20 text-slate-500 hover:text-red-400 rounded-full font-black text-lg transition">&times;</button>
                            <div class="flex justify-between items-center mb-3 pr-6">
                                <span class="text-white font-bold text-sm capitalize">${d}</span>
                                <div class="flex gap-2 text-[10px] font-black uppercase">
                                    <span class="bg-emerald-900/40 text-emerald-400 px-2 py-1 rounded">Réveil: ${data.painMorning}/10</span>
                                    <span class="bg-orange-900/40 text-orange-400 px-2 py-1 rounded">Activité: ${data.painActivity}/10</span>
                                </div>
                            </div>
                            <p class="text-slate-400 text-xs leading-relaxed">${data.notes || 'Aucune note.'}</p>
                        </div>`;
                    count++;
                });
                if(count === 0) rehabList.innerHTML = '<p class="text-xs text-slate-500 italic">Aucun bilan enregistré pour le moment.</p>';
            });

            loadWorkoutForDate();
        }

        function updateExerciseDropdowns() {
            const planSelect = document.getElementById('add-ex-select');
            const chartSelect = document.getElementById('chart-exercise-select');
            const todaySelect = document.getElementById('today-add-ex-select');
            
            const currentPlanVal = planSelect?.value;
            const currentChartVal = chartSelect?.value;
            const currentTodayVal = todaySelect?.value;

            if(planSelect) planSelect.innerHTML = ''; 
            if(chartSelect) chartSelect.innerHTML = '';
            if(todaySelect) todaySelect.innerHTML = '';
            
            for (const [category, exercises] of Object.entries(categorizedExercises)) {
                let group1 = document.createElement('optgroup'); group1.label = category;
                let group2 = document.createElement('optgroup'); group2.label = category;
                let group3 = document.createElement('optgroup'); group3.label = category;
                let uniqueEx = [...new Set(exercises)].sort();
                uniqueEx.forEach(ex => {
                    group1.appendChild(new Option(ex, ex));
                    group2.appendChild(new Option(ex, ex));
                    group3.appendChild(new Option(ex, ex));
                });
                if(planSelect) planSelect.appendChild(group1);
                if(chartSelect) chartSelect.appendChild(group2);
                if(todaySelect) todaySelect.appendChild(group3);
            }

            if(customExercises.length > 0) {
                let groupCustom1 = document.createElement('optgroup'); groupCustom1.label = "🛠️ Custom";
                let groupCustom2 = document.createElement('optgroup'); groupCustom2.label = "🛠️ Custom";
                let groupCustom3 = document.createElement('optgroup'); groupCustom3.label = "🛠️ Custom";
                customExercises.sort().forEach(ex => {
                    groupCustom1.appendChild(new Option(ex, ex));
                    groupCustom2.appendChild(new Option(ex, ex));
                    groupCustom3.appendChild(new Option(ex, ex));
                });
                if(planSelect) planSelect.appendChild(groupCustom1);
                if(chartSelect) chartSelect.appendChild(groupCustom2);
                if(todaySelect) todaySelect.appendChild(groupCustom3);
            }

            if(currentPlanVal && planSelect) planSelect.value = currentPlanVal;
            if(currentChartVal && chartSelect) chartSelect.value = currentChartVal;
            if(currentTodayVal && todaySelect) todaySelect.value = currentTodayVal;
        }

        window.changeWorkoutDate = (offset) => {
            currentWorkoutDate.setDate(currentWorkoutDate.getDate() + offset);
            window.editingLogId = null; 
            window.forceShowInput = {};
            loadWorkoutForDate();
        };

        async function loadWorkoutForDate() {
            const dateStr = getLocalDateStr(currentWorkoutDate);
            const docRef = doc(db, `users/${currentUser.uid}/plannedWorkouts`, dateStr);
            const docSnap = await getDoc(docRef);
            
            const formatEx = (ex) => typeof ex === 'string' ? {name: ex, sets: "", reps: "", weight: ""} : ex;

            if (docSnap.exists() && docSnap.data().exercises && docSnap.data().exercises.length > 0) {
                currentWorkoutExercises = docSnap.data().exercises.map(formatEx);
                let sessionName = docSnap.data().sessionName || "Séance du Jour";
                let isCompleted = !!docSnap.data().completed;
                
                document.getElementById('workout-day-title').innerText = sessionName;
                
                if (isCompleted) {
                    document.getElementById('workout-status-badge').innerText = `Terminée 🏆`;
                    document.getElementById('workout-status-badge').className = "bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1 rounded-full font-bold";
                } else {
                    document.getElementById('workout-status-badge').innerText = `${currentWorkoutExercises.length} Exercices`;
                    document.getElementById('workout-status-badge').className = "bg-violet-600/20 text-violet-400 border border-violet-500/30 text-xs px-3 py-1 rounded-full font-bold";
                }
                
                const btnComplete = document.getElementById('btn-complete-workout');
                btnComplete.classList.remove('hidden');
                if (isCompleted) {
                    btnComplete.innerText = "✅ Séance Terminée (Annuler)";
                    btnComplete.className = "mt-6 text-emerald-400 border border-emerald-500/30 bg-emerald-900/20 px-4 py-4 rounded-2xl font-black text-sm uppercase tracking-wider transition w-full";
                } else {
                    btnComplete.innerText = "🏁 Valider la séance";
                    btnComplete.className = "mt-6 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-4 rounded-2xl font-black text-sm uppercase tracking-wider transition w-full shadow-lg shadow-emerald-900/50";
                }
            } else {
                currentWorkoutExercises = [];
                document.getElementById('workout-day-title').innerText = "Jour de Repos";
                document.getElementById('workout-status-badge').innerText = "Aucun plan";
                document.getElementById('workout-status-badge').className = "bg-slate-800 text-slate-400 text-xs px-3 py-1 rounded-full font-bold";
                document.getElementById('btn-complete-workout').classList.add('hidden');
            }

            if (dateStr === getLocalDateStr(new Date())) {
                document.getElementById('current-date-display').innerText = "Aujourd'hui";
            } else {
                document.getElementById('current-date-display').innerText = currentWorkoutDate.toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'});
            }
            
            if (allNotes[dateStr]) {
                document.getElementById('workout-notes').value = allNotes[dateStr];
            } else {
                document.getElementById('workout-notes').value = "";
            }
            
            renderWorkoutCards();
        }

        window.toggleWorkoutCompletion = async () => {
            const dateStr = getLocalDateStr(currentWorkoutDate);
            const docRef = doc(db, `users/${currentUser.uid}/plannedWorkouts`, dateStr);
            const docSnap = await getDoc(docRef);
            let currentlyCompleted = docSnap.exists() && !!docSnap.data().completed;
            
            if(currentlyCompleted) {
                if(!confirm("Annuler la validation de cette séance ?")) return;
                await setDoc(docRef, { completed: false }, { merge: true });
            } else {
                if(!confirm("Valider définitivement cette séance ?")) return;
                await setDoc(docRef, { completed: true }, { merge: true });
            }
            loadWorkoutForDate();
        };

        window.saveWorkoutNote = async () => {
            const note = document.getElementById('workout-notes').value;
            const dateStr = getLocalDateStr(currentWorkoutDate);
            try {
                await setDoc(doc(db, `users/${currentUser.uid}/workoutNotes`, dateStr), {
                    note: note, ts: serverTimestamp()
                }, {merge: true});
                
                const btn = document.querySelector('button[onclick="saveWorkoutNote()"]');
                btn.innerText = "✅ Enregistré !";
                btn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-500');
                setTimeout(() => {
                    btn.innerText = "Enregistrer la note";
                    btn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-500');
                }, 2000);
            } catch (e) { alert("Erreur."); }
        };

        window.addExerciseToWorkout = async () => {
            const exName = document.getElementById('today-add-ex-select').value;
            if(!exName) return;
            if(!currentWorkoutExercises.find(e => e.name === exName)) {
                currentWorkoutExercises.push({name: exName, sets: "", reps: "", weight: ""});
                const dateStr = getLocalDateStr(currentWorkoutDate);
                await setDoc(doc(db, `users/${currentUser.uid}/plannedWorkouts`, dateStr), {
                    exercises: currentWorkoutExercises
                }, { merge: true });
                loadWorkoutForDate();
            }
        };

        window.removeExerciseFromWorkout = async (exName) => {
            if(!confirm(`Retirer ${exName} de cette séance ?\n(Cela supprimera aussi les séries enregistrées pour cet exo à cette date)`)) return;
            
            currentWorkoutExercises = currentWorkoutExercises.filter(e => e.name !== exName);
            const dateStr = getLocalDateStr(currentWorkoutDate);
            await setDoc(doc(db, `users/${currentUser.uid}/plannedWorkouts`, dateStr), {
                exercises: currentWorkoutExercises
            }, { merge: true });
            
            const targetDateStr = currentWorkoutDate.toDateString();
            const logsToDelete = allLogs.filter(l => l.exercise === exName && l.ts && new Date(l.ts.toDate()).toDateString() === targetDateStr);
            
            for (let log of logsToDelete) {
                await deleteDoc(doc(db, `users/${currentUser.uid}/workoutLogs`, log.id));
            }
            loadWorkoutForDate();
        };

        window.startEdit = (logId) => {
            window.editingLogId = logId;
            renderWorkoutCards();
        };

        window.cancelEdit = () => {
            window.editingLogId = null;
            renderWorkoutCards();
        };

        window.saveEdit = async (logId) => {
            const repsInput = document.getElementById(`edit-reps-${logId}`);
            const weightInput = document.getElementById(`edit-weight-${logId}`);
            
            const newReps = parseInt(repsInput.value);
            const weightVal = weightInput.value;
            const newWeight = (weightVal.toUpperCase() === 'PDC' || parseFloat(weightVal) === 0) ? 0 : parseFloat(weightVal.replace(',', '.'));
            
            if (!isNaN(newReps) && !isNaN(newWeight)) {
                try {
                    await updateDoc(doc(db, `users/${currentUser.uid}/workoutLogs`, logId), {
                        reps: newReps, weight: newWeight
                    });
                    window.editingLogId = null;
                } catch(e) { alert("Erreur de mise à jour."); }
            }
        };

        window.deleteLog = async (logId) => {
            if(confirm("Supprimer cette série ?")) {
                await deleteDoc(doc(db, `users/${currentUser.uid}/workoutLogs`, logId));
            }
        };

        window.forceInputShow = (safeName) => {
            window.forceShowInput[safeName] = true;
            renderWorkoutCards();
        };
        
        window.openLastSession = (exName) => {
            const dateLimit = new Date(currentWorkoutDate);
            dateLimit.setHours(0,0,0,0);
            
            let pastLogs = allLogs.filter(l => l.exercise === exName && l.ts && l.ts.toDate() < dateLimit);
            if (pastLogs.length === 0) {
                alert("Aucune séance précédente trouvée pour cet exercice.");
                return;
            }
            
            let maxDate = new Date(0);
            pastLogs.forEach(l => { if (l.ts.toDate() > maxDate) maxDate = l.ts.toDate(); });
            const maxDateStr = maxDate.toDateString();
            
            let lastSessionLogs = pastLogs.filter(l => l.ts.toDate().toDateString() === maxDateStr).reverse();
            
            document.getElementById('modal-ls-title').innerText = exName;
            document.getElementById('modal-ls-date').innerText = maxDate.toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
            
            let contentHTML = '';
            lastSessionLogs.forEach((log, idx) => {
                const weightText = (log.weight === 0 || log.weight === '0') ? "PDC" : `${log.weight} kg`;
                contentHTML += `
                    <div class="grid grid-cols-3 gap-2 items-center text-center bg-[#1c1c1e] p-2 rounded-lg border border-[#333]">
                        <div class="text-xs font-bold text-violet-400">Set ${idx+1}</div>
                        <div class="text-sm font-black text-white">${log.reps}</div>
                        <div class="text-sm font-black text-white">${weightText}</div>
                    </div>
                `;
            });
            document.getElementById('modal-ls-content').innerHTML = contentHTML;
            document.getElementById('last-session-modal').classList.remove('hidden');
        };
        
        window.closeLastSessionModal = () => {
            document.getElementById('last-session-modal').classList.add('hidden');
        };

        function renderWorkoutCards() {
            const container = document.getElementById('workout-exercises-container');
            container.innerHTML = '';
            
            const targetDateStr = currentWorkoutDate.toDateString();
            const targetLogs = allLogs.filter(l => l.ts && new Date(l.ts.toDate()).toDateString() === targetDateStr);

            let exercisesToShow = [...currentWorkoutExercises]; 
            let loggedExNames = [...new Set(targetLogs.map(l => l.exercise))];
            
            loggedExNames.forEach(exName => {
                if(!exercisesToShow.find(e => e.name === exName)) exercisesToShow.push({name: exName, sets: "", reps: "", weight: ""});
            });

            if(exercisesToShow.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10">
                        <span class="text-5xl block mb-4">🛋️</span>
                        <p class="text-slate-400 font-medium">Rien de prévu pour ce jour.</p>
                    </div>`;
                return;
            }

            exercisesToShow.forEach((exObj, exIndex) => {
                const isString = typeof exObj === 'string';
                const exName = isString ? exObj : exObj.name;
                
                const exLogs = targetLogs.filter(l => l.exercise === exName).reverse(); 
                const safeName = exName.replace(/'/g, "\\'");
                
                const card = document.createElement('div');
                card.className = "exercise-card";
                
                // --- RÉCUPÉRATION CORRIGÉE DES OBJECTIFS DE SETS ---
                const defaultDetails = getExerciseDetails(exName) || {};
                const pSets = (!isString && exObj.sets) ? exObj.sets : defaultDetails.sets || "";
                const pReps = (!isString && exObj.reps) ? exObj.reps : defaultDetails.reps || "";
                
                const targetSets = parseInt(pSets) || 0;
                
                let planHTML = "";
                if (pSets && pReps) {
                    planHTML = `<span class="text-xs font-bold text-violet-400 bg-violet-900/30 px-2 py-1 rounded-md ml-2">${pSets} Sets &times; ${pReps}</span>`;
                } else if (pSets) {
                    planHTML = `<span class="text-xs font-bold text-violet-400 bg-violet-900/30 px-2 py-1 rounded-md ml-2">${pSets} Sets</span>`;
                }
                
                let html = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex-1">
                            <h3 class="font-black text-lg text-white leading-tight">${exName}</h3>
                            ${planHTML}
                            <button onclick="openLastSession('${safeName}')" class="block text-[10px] text-slate-400 underline mt-2 hover:text-white transition">🕒 Voir la dernière séance</button>
                        </div>
                        <button onclick="removeExerciseFromWorkout('${safeName}')" class="text-slate-500 hover:text-red-500 px-2 text-2xl leading-none ml-2">&times;</button>
                    </div>
                    
                    <div class="space-y-2 mb-4">
                        <div class="grid grid-columns-5 gap-2 px-1 mb-1 set-row" style="opacity: 0.5;">
                            <div class="text-[10px] font-bold uppercase tracking-wider text-center">Set</div>
                            <div class="text-[10px] font-bold uppercase tracking-wider text-center">Reps</div>
                            <div></div>
                            <div class="text-[10px] font-bold uppercase tracking-wider text-center">Kgs/Pdc</div>
                            <div></div>
                        </div>
                `;

                exLogs.forEach((log, idx) => {
                    const weightDisplay = (log.weight === 0 || log.weight === "0") ? "PDC" : log.weight;
                    
                    if (window.editingLogId === log.id) {
                        html += `
                            <div class="set-row bg-[#1c1c1e] rounded-xl px-2 py-2 border border-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.3)]">
                                <div class="w-6 h-6 rounded-full bg-blue-600/30 text-blue-400 flex items-center justify-center text-xs font-black mx-auto">${idx + 1}</div>
                                <div><input type="number" inputmode="numeric" id="edit-reps-${log.id}" class="log-input text-base py-1 px-0" value="${log.reps}"></div>
                                <div class="text-slate-600 text-xs font-bold text-center">&times;</div>
                                <div class="relative w-full h-full flex items-center">
                                    <input type="text" inputmode="decimal" id="edit-weight-${log.id}" class="log-input text-base py-1 pr-6 pl-1 w-full" value="${weightDisplay}">
                                    <button onclick="document.getElementById('edit-weight-${log.id}').value='PDC'" class="absolute right-1 bg-[#333] text-[8px] font-black text-slate-300 rounded p-1">PDC</button>
                                </div>
                                <div class="flex justify-end items-center gap-3 pr-2">
                                    <button onclick="saveEdit('${log.id}')" class="text-blue-400 hover:text-blue-300 text-xl transition">💾</button>
                                    <button onclick="cancelEdit()" class="text-slate-500 hover:text-red-400 text-xl transition">&times;</button>
                                </div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="set-row bg-[#121212] rounded-xl px-2 py-2 border border-[#333]">
                                <div class="w-6 h-6 rounded-full bg-violet-600/30 text-violet-400 flex items-center justify-center text-xs font-black mx-auto">${idx + 1}</div>
                                <div class="text-center font-black text-white text-lg">${log.reps}</div>
                                <div class="text-slate-600 text-xs font-bold text-center">&times;</div>
                                <div class="text-center font-black text-white text-lg">${weightDisplay}</div>
                                <div class="flex justify-end items-center gap-2 pr-1">
                                    <span class="text-emerald-400 text-sm hidden sm:inline mr-1">✔</span>
                                    <button onclick="startEdit('${log.id}')" class="text-slate-500 hover:text-blue-400 text-lg transition">✏️</button>
                                    <button onclick="deleteLog('${log.id}')" class="text-slate-500 hover:text-red-500 text-xl font-black transition">&times;</button>
                                </div>
                            </div>
                        `;
                    }
                });

                const nextSetNum = exLogs.length + 1;
                
                let suggestedWeight = '';
                if(exLogs.length > 0) {
                    suggestedWeight = exLogs[exLogs.length-1].weight;
                } else if (!isString && exObj.weight !== undefined && exObj.weight !== "") {
                    suggestedWeight = exObj.weight;
                }
                let suggestedWeightDisplay = (suggestedWeight == 0 || String(suggestedWeight).toUpperCase() === 'PDC') ? 'PDC' : suggestedWeight;
                
                let suggestedReps = '';
                if (exLogs.length > 0) {
                    suggestedReps = exLogs[exLogs.length-1].reps;
                } else if (pReps) {
                    let match = String(pReps).match(/\d+/);
                    suggestedReps = match ? match[0] : '';
                }
                
                const isGoalReached = targetSets > 0 && exLogs.length >= targetSets;
                const isForceShow = window.forceShowInput[exName] === true;

                if (!isGoalReached || isForceShow) {
                    html += `
                            <div class="set-row">
                                <div class="w-6 h-6 rounded-full bg-[#333] text-slate-400 flex items-center justify-center text-xs font-black mx-auto">${nextSetNum}</div>
                                <div><input type="number" inputmode="numeric" id="reps-${exIndex}" class="log-input text-lg" value="${suggestedReps}" placeholder="0"></div>
                                <div class="text-slate-600 text-xs font-bold text-center">&times;</div>
                                <div class="relative w-full h-full flex items-center">
                                    <input type="text" inputmode="decimal" id="weight-${exIndex}" class="log-input text-lg w-full pr-8" value="${suggestedWeightDisplay}" placeholder="0">
                                    <button onclick="document.getElementById('weight-${exIndex}').value='PDC'" class="absolute right-1 bg-[#333] text-[9px] font-black text-slate-300 rounded px-1.5 py-1">PDC</button>
                                </div>
                                <button onclick="saveSpecificSet('${safeName}', ${exIndex})" class="bg-[#2c2c2e] hover:bg-violet-600 text-white font-bold text-xs py-2 rounded-xl transition w-full shadow-md border border-[#444]">SAVE</button>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                            <div class="mt-4 p-3 bg-emerald-900/20 border border-emerald-500/20 rounded-xl text-center">
                                <div class="text-emerald-400 font-black mb-2 flex justify-center items-center gap-2"><span>✅</span> Objectif Atteint !</div>
                                <button onclick="forceInputShow('${safeName}')" class="text-[10px] uppercase font-bold text-slate-400 hover:text-white underline">+ Ajouter une série libre</button>
                            </div>
                        </div>
                    `;
                }
                
                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        window.saveSpecificSet = async (exName, index) => {
            const repsInput = document.getElementById(`reps-${index}`);
            const weightInput = document.getElementById(`weight-${index}`);
            
            const reps = parseInt(repsInput.value) || 0;
            const weightVal = weightInput.value;
            const weight = (weightVal.toUpperCase() === 'PDC' || parseFloat(weightVal) === 0 || weightVal === '') ? 0 : parseFloat(weightVal.replace(',', '.'));

            if (reps === 0) {
                repsInput.classList.add('border-red-500');
                setTimeout(() => repsInput.classList.remove('border-red-500'), 1000);
                return;
            }

            try {
                window.forceShowInput[exName] = false;
                
                let tsDate = new Date();
                const parts = getLocalDateStr(currentWorkoutDate).split('-'); 
                tsDate.setFullYear(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
                
                await addDoc(collection(db, `users/${currentUser.uid}/workoutLogs`), {
                    exercise: exName, weight, reps, ts: Timestamp.fromDate(tsDate)
                });
            } catch (e) { alert("Erreur d'enregistrement."); }
        };

        // --- PARTAGE ---
        window.shareWorkoutToPartner = async () => {
            const exos = weekPlansData[selectedPlanDateStr] || [];
            if(exos.length === 0) return alert("Cette séance est vide ! Ajoute des exercices avant d'envoyer.");
            
            try {
                const payload = {
                    sender: currentUser.displayName || "Ton partenaire",
                    date: selectedPlanDateStr,
                    exercises: exos,
                    ts: serverTimestamp()
                };
                if(weekPlansData[selectedPlanDateStr].sessionName) {
                    payload.sessionName = weekPlansData[selectedPlanDateStr].sessionName;
                }
                await setDoc(doc(db, "shared", "partner_sync"), payload);
                alert("Séance envoyée ! Ton partenaire peut maintenant la récupérer.");
            } catch (e) { alert("Erreur lors de l'envoi de la séance."); }
        };

        window.importPartnerWorkout = async () => {
            try {
                const snap = await getDoc(doc(db, "shared", "partner_sync"));
                if (snap.exists() && snap.data().exercises) {
                    const data = snap.data();
                    const dParts = data.date.split('-');
                    const d = new Date(dParts[0], dParts[1]-1, dParts[2]).toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'});
                    
                    if(confirm(`Récupérer la séance du ${d} envoyée par ${data.sender} ?\n(Cela sera placé exactement à cette date dans ton plan, avec les objectifs de séries/poids)`)) {
                        const payload = {
                            exercises: data.exercises,
                            completed: false
                        };
                        if(data.sessionName) payload.sessionName = data.sessionName;
                        
                        await setDoc(doc(db, `users/${currentUser.uid}/plannedWorkouts`, data.date), payload, { merge: true });
                        loadWeekView();
                        if(data.date === getLocalDateStr(currentWorkoutDate)) loadWorkoutForDate();
                        alert("Séance importée à la date prévue !");
                    }
                } else {
                    alert("Aucune séance n'a été partagée récemment.");
                }
            } catch (e) { alert("Erreur lors de la récupération."); }
        };

        // --- PLANNING ---
        window.changeWeek = (offset) => {
            currentWeekStartDate.setDate(currentWeekStartDate.getDate() + (offset * 7));
            closeDayEditor();
            loadWeekView();
        };

        window.loadWeekView = async () => {
            const weekEnd = new Date(currentWeekStartDate);
            weekEnd.setDate(weekEnd.getDate() + 6);
            
            const startStr = currentWeekStartDate.toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'});
            const endStr = weekEnd.toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'});
            document.getElementById('week-label').innerText = `${startStr} - ${endStr}`;

            const grid = document.getElementById('week-grid');
            grid.innerHTML = '<div class="w-full text-center text-sm text-slate-500 py-4 col-span-7">Chargement...</div>';

            const days = ["LUN", "MAR", "MER", "JEU", "VEN", "SAM", "DIM"];
            weekPlansData = {};
            weekCompletedData = {}; 

            for(let i = 0; i < 7; i++) {
                let d = new Date(currentWeekStartDate);
                d.setDate(d.getDate() + i);
                let dStr = getLocalDateStr(d);
                
                const docSnap = await getDoc(doc(db, `users/${currentUser.uid}/plannedWorkouts`, dStr));
                const formatEx = (ex) => typeof ex === 'string' ? {name: ex, sets: "", reps: "", weight: ""} : ex;

                if (docSnap.exists()) {
                    if (docSnap.data().exercises) weekPlansData[dStr] = docSnap.data().exercises.map(formatEx);
                    weekCompletedData[dStr] = !!docSnap.data().completed;
                    if(docSnap.data().sessionName) weekPlansData[dStr].sessionName = docSnap.data().sessionName;
                } else {
                    weekPlansData[dStr] = [];
                    weekCompletedData[dStr] = false;
                }
            }

            grid.innerHTML = '';
            const todayStr = getLocalDateStr(new Date());

            for(let i = 0; i < 7; i++) {
                let d = new Date(currentWeekStartDate);
                d.setDate(d.getDate() + i);
                let dStr = getLocalDateStr(d);
                
                const nbEx = weekPlansData[dStr].length;
                const isCompleted = weekCompletedData[dStr];
                const isToday = (dStr === todayStr);
                
                let dotClass = 'bg-transparent';
                if(nbEx > 0) {
                    if (isCompleted) dotClass = 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]';
                    else if (isToday) dotClass = 'bg-white';
                    else dotClass = 'bg-violet-500';
                }
                
                const card = document.createElement('div');
                card.onclick = () => openDayEditor(dStr, days[i], d.getDate());
                card.className = `p-1 sm:p-2 rounded-xl cursor-pointer transition flex flex-col items-center justify-center text-center
                    ${isToday ? 'bg-violet-600 shadow-lg shadow-violet-900/50' : 'bg-[#121212] border border-[#333] hover:border-violet-500'}`;
                
                card.innerHTML = `
                    <span class="text-[9px] sm:text-[10px] font-black ${isToday ? 'text-violet-200' : 'text-slate-500'} tracking-wider">${days[i]}</span>
                    <span class="text-base sm:text-lg font-black ${isToday ? 'text-white' : 'text-slate-300'} my-1">${d.getDate()}</span>
                    <div class="w-2 h-2 rounded-full ${dotClass}"></div>
                `;
                
                grid.appendChild(card);
            }
        };

        window.openDayEditor = (dateStr, dayName, dayNum) => {
            selectedPlanDateStr = dateStr;
            document.getElementById('editor-date-label').innerText = `Édition : ${dayName} ${dayNum}`;
            document.getElementById('shift-date').value = dateStr; 
            
            const sessName = weekPlansData[dateStr]?.sessionName || "";
            document.getElementById('plan-session-name').value = sessName;

            let lastWeek = new Date(dateStr);
            lastWeek.setDate(lastWeek.getDate() - 7);
            document.getElementById('copy-date').value = getLocalDateStr(lastWeek);

            document.getElementById('day-editor').classList.remove('hidden');
            setTimeout(() => document.getElementById('day-editor').scrollIntoView({behavior: "smooth", block: "nearest"}), 100);
            renderEditorList();
        };

        window.closeDayEditor = () => {
            document.getElementById('day-editor').classList.add('hidden');
            selectedPlanDateStr = null;
        };

        window.saveSessionName = async () => {
            if(!selectedPlanDateStr) return;
            const newName = document.getElementById('plan-session-name').value;
            weekPlansData[selectedPlanDateStr].sessionName = newName;
            await savePlanToDB(selectedPlanDateStr, weekPlansData[selectedPlanDateStr]);
        };

        window.updatePlanEx = async (idx, field, value) => {
            if(!selectedPlanDateStr) return;
            weekPlansData[selectedPlanDateStr][idx][field] = value;
            await savePlanToDB(selectedPlanDateStr, weekPlansData[selectedPlanDateStr]);
        };

        function renderEditorList() {
            const container = document.getElementById('planned-exercises-list');
            container.innerHTML = '';
            const exos = weekPlansData[selectedPlanDateStr] || [];
            if(exos.length === 0) {
                container.innerHTML = '<span class="text-slate-500 text-xs italic">Aucun exercice prévu ce jour.</span>';
            } else {
                exos.forEach((exObj, idx) => {
                    const div = document.createElement('div');
                    div.className = "bg-[#1c1c1e] p-3 rounded-xl border border-[#333]";
                    div.innerHTML = `
                        <div class="flex justify-between items-center mb-2">
                            <div class="text-sm font-semibold text-slate-200">${exObj.name}</div>
                            <button onclick="removeExerciseFromPlan(${idx})" class="text-slate-500 hover:text-red-400 text-2xl leading-none">&times;</button>
                        </div>
                        <div class="flex gap-2">
                            <div class="flex-1">
                                <label class="text-[9px] font-bold text-slate-500 uppercase px-1">Sets</label>
                                <input type="number" inputmode="numeric" placeholder="Sets" class="w-full bg-[#121212] text-white text-xs p-2 rounded-lg border border-[#333] focus:border-violet-500 outline-none text-center" value="${exObj.sets || ''}" onchange="updatePlanEx(${idx}, 'sets', this.value)">
                            </div>
                            <div class="flex-1">
                                <label class="text-[9px] font-bold text-slate-500 uppercase px-1">Reps</label>
                                <input type="text" placeholder="Reps" class="w-full bg-[#121212] text-white text-xs p-2 rounded-lg border border-[#333] focus:border-violet-500 outline-none text-center" value="${exObj.reps || ''}" onchange="updatePlanEx(${idx}, 'reps', this.value)">
                            </div>
                            <div class="flex-1">
                                <label class="text-[9px] font-bold text-slate-500 uppercase px-1">Poids</label>
                                <input type="text" placeholder="Kg/PDC" class="w-full bg-[#121212] text-white text-xs p-2 rounded-lg border border-[#333] focus:border-violet-500 outline-none text-center" value="${exObj.weight || ''}" onchange="updatePlanEx(${idx}, 'weight', this.value)">
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }
        }

        window.addExerciseToPlan = async () => {
            const exName = document.getElementById('add-ex-select').value;
            if(!exName || !selectedPlanDateStr) return;
            if(!weekPlansData[selectedPlanDateStr]) weekPlansData[selectedPlanDateStr] = [];
            
            weekPlansData[selectedPlanDateStr].push({name: exName, sets: "", reps: "", weight: ""});
            await savePlanToDB(selectedPlanDateStr, weekPlansData[selectedPlanDateStr]);
            renderEditorList();
            loadWeekView(); 
        };

        window.removeExerciseFromPlan = async (idx) => {
            weekPlansData[selectedPlanDateStr].splice(idx, 1);
            await savePlanToDB(selectedPlanDateStr, weekPlansData[selectedPlanDateStr]);
            renderEditorList();
            loadWeekView();
        };

        async function savePlanToDB(dateStr, exosArr) {
            const payload = { exercises: exosArr };
            if(exosArr.sessionName) payload.sessionName = exosArr.sessionName;
            await setDoc(doc(db, `users/${currentUser.uid}/plannedWorkouts`, dateStr), payload, { merge: true });
            if(dateStr === getLocalDateStr(currentWorkoutDate)) loadWorkoutForDate();
        }

        window.shiftWorkout = async () => {
            const targetDateStr = document.getElementById('shift-date').value;
            if(!targetDateStr || targetDateStr === selectedPlanDateStr) return;
            
            const exosToMove = weekPlansData[selectedPlanDateStr] || [];
            if(exosToMove.length === 0) return alert("Rien à décaler ce jour-là.");

            if(confirm(`Déplacer ces ${exosToMove.length} exercices au ${targetDateStr} ?`)) {
                try {
                    const payload = { exercises: exosToMove };
                    if(exosToMove.sessionName) payload.sessionName = exosToMove.sessionName;

                    await setDoc(doc(db, `users/${currentUser.uid}/plannedWorkouts`, targetDateStr), payload, { merge: true });
                    await deleteDoc(doc(db, `users/${currentUser.uid}/plannedWorkouts`, selectedPlanDateStr));
                    
                    weekPlansData[selectedPlanDateStr] = []; 
                    closeDayEditor();
                    loadWeekView(); 
                    if(selectedPlanDateStr === getLocalDateStr(currentWorkoutDate) || targetDateStr === getLocalDateStr(currentWorkoutDate)) loadWorkoutForDate();
                } catch(e) { alert("Erreur lors du décalage."); }
            }
        };

        window.copyWorkoutPlan = async () => {
            const sourceDateStr = document.getElementById('copy-date').value;
            if(!sourceDateStr || sourceDateStr === selectedPlanDateStr) return;

            try {
                const docSnap = await getDoc(doc(db, `users/${currentUser.uid}/plannedWorkouts`, sourceDateStr));
                if (docSnap.exists() && docSnap.data().exercises && docSnap.data().exercises.length > 0) {
                    const sourceExos = docSnap.data().exercises;
                    if(confirm(`Copier les ${sourceExos.length} exercices du ${sourceDateStr} vers le ${selectedPlanDateStr} ?`)) {
                        weekPlansData[selectedPlanDateStr] = [...sourceExos];
                        
                        const payload = { exercises: weekPlansData[selectedPlanDateStr] };
                        if(docSnap.data().sessionName) {
                            payload.sessionName = docSnap.data().sessionName;
                            weekPlansData[selectedPlanDateStr].sessionName = payload.sessionName;
                        }

                        await setDoc(doc(db, `users/${currentUser.uid}/plannedWorkouts`, selectedPlanDateStr), payload, { merge: true });
                        renderEditorList();
                        document.getElementById('plan-session-name').value = payload.sessionName || "";
                        
                        loadWeekView();
                        if(selectedPlanDateStr === getLocalDateStr(currentWorkoutDate)) loadWorkoutForDate();
                    }
                } else { alert("Aucun plan trouvé à cette date !"); }
            } catch(e) { alert("Erreur lors de la copie."); }
        };

        // --- REHAB ---
        window.saveRehab = async () => {
            const morning = parseInt(document.getElementById('pain-morning').value);
            const activity = parseInt(document.getElementById('pain-activity').value);
            const notes = document.getElementById('rehab-notes').value;

            try {
                await addDoc(collection(db, `users/${currentUser.uid}/rehabLogs`), {
                    painMorning: morning, painActivity: activity, notes, ts: serverTimestamp()
                });
                document.getElementById('rehab-notes').value = '';
            } catch (e) { alert("Erreur d'enregistrement."); }
        };

        window.deleteRehab = async (logId) => {
            if(confirm("Supprimer ce bilan d'historique ?")) {
                await deleteDoc(doc(db, `users/${currentUser.uid}/rehabLogs`, logId));
            }
        };

        // --- HISTORIQUE COMPLET DES SÉANCES ---
        function renderWorkoutHistory() {
            const container = document.getElementById('workout-history-list');
            if(!container) return;
            
            const grouped = {};
            allLogs.forEach(log => {
                if(!log.ts) return;
                const d = log.ts.toDate();
                const offset = d.getTimezoneOffset() * 60000;
                const dateKey = (new Date(d - offset)).toISOString().split('T')[0];
                
                if(!grouped[dateKey]) grouped[dateKey] = { date: d, logs: [] };
                grouped[dateKey].logs.push(log);
            });
            
            const sortedKeys = Object.keys(grouped).sort((a,b) => b.localeCompare(a));
            
            container.innerHTML = '';
            if(sortedKeys.length === 0) {
                container.innerHTML = '<p class="text-sm text-slate-500 italic">Aucune séance passée.</p>';
                return;
            }
            
            let count = 0;
            sortedKeys.forEach(key => {
                if(count >= 15) return; 
                const dayData = grouped[key];
                const dateStrDisplay = dayData.date.toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'});
                const note = allNotes[key];
                
                const exMap = {};
                [...dayData.logs].reverse().forEach(l => {
                    if(!exMap[l.exercise]) exMap[l.exercise] = [];
                    exMap[l.exercise].push(l);
                });
                
                let exHtml = '';
                for(let ex in exMap) {
                    const setsStr = exMap[ex].map(s => {
                        let w = (s.weight == 0 || s.weight === "0") ? "PDC" : `${s.weight}kg`;
                        return `${w} &times; ${s.reps}`;
                    }).join(' <span class="text-slate-600">|</span> ');
                    
                    exHtml += `
                        <div class="mb-2 bg-[#121212] p-2 rounded-lg border border-[#333]">
                            <span class="text-[11px] font-black text-violet-400 block mb-1 uppercase tracking-wider">${ex}</span>
                            <span class="text-xs text-white font-semibold">${setsStr}</span>
                        </div>`;
                }
                
                let noteHtml = note ? `
                    <div class="mt-3 p-3 bg-[#121212] rounded-xl border border-violet-900/50">
                        <span class="text-[10px] font-bold text-violet-400 uppercase tracking-widest block mb-1">📝 Notes de séance</span>
                        <p class="text-xs text-slate-300 italic leading-relaxed">"${note}"</p>
                    </div>` : '';
                
                container.innerHTML += `
                    <div class="bg-[#1c1c1e] p-5 rounded-2xl border border-[#333] mb-4 shadow-md">
                        <h4 class="font-black text-white capitalize mb-4 border-b border-[#333] pb-2 text-lg">${dateStrDisplay}</h4>
                        <div class="space-y-1">
                            ${exHtml}
                        </div>
                        ${noteHtml}
                    </div>
                `;
                count++;
            });
        }

        window.renderChart = () => {
            const ctx = document.getElementById('progression-chart').getContext('2d');
            const selectedEx = document.getElementById('chart-exercise-select').value;
            if(!selectedEx) return;
            
            const exLogs = allLogs.filter(l => l.exercise === selectedEx && l.ts);
            
            const maxPerDay = {};
            exLogs.forEach(log => {
                const d = new Date(log.ts.toDate()).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
                if(!maxPerDay[d] || log.weight > maxPerDay[d]) maxPerDay[d] = log.weight;
            });

            const sortedDates = Object.keys(maxPerDay).reverse();
            const dataWeights = sortedDates.map(d => maxPerDay[d]);

            if (chartInstance) chartInstance.destroy();

            Chart.defaults.color = '#94a3b8';
            Chart.defaults.font.family = 'Inter';

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sortedDates,
                    datasets: [{
                        label: 'Max Poids (kg)',
                        data: dataWeights,
                        borderColor: '#8b5cf6',
                        backgroundColor: 'rgba(139, 92, 246, 0.1)',
                        borderWidth: 4,
                        pointRadius: 6,
                        pointBackgroundColor: '#121212',
                        pointBorderColor: '#8b5cf6',
                        pointBorderWidth: 2,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: '#333' }, border: { dash: [4, 4] } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        };
    </script>
</body>
</html>
