<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XMAS '26 Fitness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #121212; color: #ffffff; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .log-input {
            background-color: #1e1e24; border: 1px solid #333; color: white;
            text-align: center; font-weight: 700; border-radius: 0.5rem;
            padding: 0.5rem; width: 100%; transition: border-color 0.2s;
        }
        .log-input:focus { outline: none; border-color: #8b5cf6; }
        
        .nav-item.active { color: #8b5cf6; position: relative; }
        .nav-item.active::after {
            content: ''; position: absolute; bottom: -10px; left: 50%;
            transform: translateX(-50%); width: 4px; height: 4px;
            background-color: #8b5cf6; border-radius: 50%;
        }

        .exercise-card {
            background-color: #1c1c1e; border-radius: 1.5rem;
            padding: 1.25rem; margin-bottom: 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        
        .set-row {
            display: grid; grid-template-columns: 1fr 2fr 10px 2fr 3fr;
            align-items: center; gap: 0.5rem; margin-bottom: 0.75rem;
        }
    </style>
</head>
<body class="pb-32 relative min-h-screen">

    <!-- Top Header -->
    <header class="pt-12 pb-4 px-6 flex justify-between items-center sticky top-0 bg-[#121212]/90 backdrop-blur-md z-50">
        <h1 class="text-2xl font-black tracking-tight" id="header-title">Aujourd'hui</h1>
        <div id="auth-container">
            <button id="btn-login" class="bg-violet-600 text-white px-4 py-1.5 rounded-full text-sm font-bold shadow-lg">Connexion</button>
            <div id="user-info" class="hidden flex items-center space-x-3">
                <div class="bg-violet-600/20 px-3 py-1 rounded-full border border-violet-500/30">
                    <span id="user-name" class="text-sm font-bold text-violet-400"></span>
                </div>
                <button id="btn-logout" class="text-xs text-slate-500 font-bold uppercase hover:text-white transition">Quitter</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div id="app-content" class="hidden container mx-auto px-4 space-y-6">
        
        <!-- TAB 1: WORKOUT -->
        <div id="view-workout">
            <div class="mb-6 flex justify-between items-end">
                <div>
                    <p class="text-slate-400 text-sm font-medium uppercase tracking-wider mb-1" id="current-date-display">Date</p>
                    <h2 class="text-3xl font-black text-white" id="workout-day-title">Séance Libre</h2>
                </div>
                <div id="workout-status-badge" class="bg-slate-800 text-slate-300 text-xs px-3 py-1 rounded-full font-bold">
                    0 Exercices
                </div>
            </div>

            <div id="workout-exercises-container" class="space-y-4"></div>
            
            <div class="mt-6 bg-[#121212] border border-[#333] p-4 rounded-2xl">
                <p class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider">Ajouter un exercice aujourd'hui</p>
                <div class="flex space-x-2">
                    <select id="today-add-ex-select" class="flex-1 bg-[#1c1c1e] border border-[#333] text-white rounded-xl p-3 font-semibold outline-none text-sm focus:border-violet-500"></select>
                    <button onclick="addExerciseToToday()" class="bg-violet-600 text-white px-5 rounded-xl font-black text-lg shadow-lg hover:bg-violet-500 transition">+</button>
                </div>
            </div>
        </div>

        <!-- TAB 2: PLANNING -->
        <div id="view-plan" class="hidden">
            <div class="bg-[#1c1c1e] p-6 rounded-[2rem] shadow-lg">
                
                <div id="mimi-import-section" class="hidden mb-6 p-4 bg-emerald-900/20 border border-emerald-500/20 rounded-xl text-center">
                    <p class="text-xs text-emerald-400 mb-3 font-medium">Pour générer/corriger ton plan (Repos Mer/Dim), clique ci-dessous :</p>
                    <button onclick="importMimiPlan()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl font-bold text-sm w-full transition shadow-lg shadow-emerald-900/50">🔁 Mettre à jour mon Plan</button>
                </div>

                <div class="flex justify-between items-center mb-6">
                    <button onclick="changeWeek(-1)" class="bg-[#2c2c2e] w-10 h-10 rounded-full flex items-center justify-center font-bold text-slate-300 hover:text-white transition">&larr;</button>
                    <h2 id="week-label" class="text-sm font-bold text-white tracking-wider">Semaine</h2>
                    <button onclick="changeWeek(1)" class="bg-[#2c2c2e] w-10 h-10 rounded-full flex items-center justify-center font-bold text-slate-300 hover:text-white transition">&rarr;</button>
                </div>

                <div id="week-grid" class="flex overflow-x-auto space-x-3 pb-4 scrollbar-hide mb-2 snap-x"></div>

                <div id="day-editor" class="hidden bg-[#121212] border border-[#333] p-5 rounded-2xl relative mt-4">
                    <div class="flex justify-between items-center mb-5">
                        <h3 id="editor-date-label" class="text-white font-black text-lg">Lundi 12</h3>
                        <button onclick="closeDayEditor()" class="text-slate-500 font-black text-2xl hover:text-white bg-[#1c1c1e] w-8 h-8 rounded-full flex items-center justify-center pb-1">&times;</button>
                    </div>
                    
                    <div class="mb-5">
                        <div id="planned-exercises-list" class="space-y-3 mb-2 min-h-[40px]"></div>
                    </div>

                    <div class="flex space-x-2 mb-6">
                        <select id="add-ex-select" class="flex-1 bg-[#1c1c1e] border border-[#333] text-white rounded-xl p-3 font-semibold outline-none text-sm focus:border-violet-500"></select>
                        <button onclick="addExerciseToPlan()" class="bg-violet-600 text-white px-5 rounded-xl font-black text-lg shadow-lg hover:bg-violet-500 transition">+</button>
                    </div>

                    <div class="border-t border-[#333] pt-5 mt-2">
                        <label class="block text-xs font-bold text-slate-400 mb-3">Décaler cette séance au :</label>
                        <div class="flex space-x-2">
                            <input type="date" id="shift-date" class="flex-1 bg-[#1c1c1e] border border-[#333] text-white rounded-xl p-3 text-sm font-bold outline-none focus:border-orange-500">
                            <button onclick="shiftWorkout()" class="bg-orange-500 text-white px-4 rounded-xl font-bold text-xs uppercase tracking-wider shadow-lg hover:bg-orange-400 transition">Décaler</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- TAB 3: PROGRESSION -->
        <div id="view-progress" class="hidden">
            <div class="bg-[#1c1c1e] p-6 rounded-[2rem] shadow-lg">
                <h2 class="text-lg font-black text-white mb-6">Analyse de progression</h2>
                <select id="chart-exercise-select" onchange="renderChart()" class="w-full bg-[#121212] border border-[#333] text-white rounded-xl p-4 mb-8 font-semibold outline-none focus:border-violet-500"></select>
                <div style="height: 300px; width: 100%; position: relative;"><canvas id="progression-chart"></canvas></div>
            </div>
        </div>

        <!-- TAB 4: REHAB (Mimi Only) -->
        <div id="view-rehab" class="hidden">
            <div class="bg-[#1c1c1e] p-6 rounded-[2rem] shadow-lg">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-black text-white flex items-center gap-2">🩹 Bilan Cheville</h2>
                    <span id="rehab-date-display" class="text-xs font-bold text-violet-400 bg-violet-900/30 px-2 py-1 rounded-md"></span>
                </div>
                
                <div class="bg-[#121212] border border-[#333] p-5 rounded-2xl mb-5">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Douleur au réveil (0-10)</label>
                    <div class="flex items-center gap-4">
                        <input type="range" id="pain-morning" min="0" max="10" value="0" class="flex-1 accent-emerald-500" oninput="document.getElementById('val-morning').innerText = this.value">
                        <div class="w-10 text-center text-2xl font-black text-emerald-400" id="val-morning">0</div>
                    </div>
                </div>

                <div class="bg-[#121212] border border-[#333] p-5 rounded-2xl mb-6">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Douleur en activité (0-10)</label>
                    <div class="flex items-center gap-4">
                        <input type="range" id="pain-activity" min="0" max="10" value="0" class="flex-1 accent-orange-500" oninput="document.getElementById('val-activity').innerText = this.value">
                        <div class="w-10 text-center text-2xl font-black text-orange-400" id="val-activity">0</div>
                    </div>
                </div>

                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 pl-1">Notes du jour</label>
                <textarea id="rehab-notes" class="w-full bg-[#121212] border border-[#333] rounded-2xl p-4 text-white mb-6 font-medium focus:border-violet-500 outline-none" rows="3" placeholder="Sensations, exercices effectués, gêne..."></textarea>

                <button onclick="saveRehab()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-sm transition shadow-lg shadow-emerald-900/50">Enregistrer le bilan</button>
                
                <div class="mt-8 pt-6 border-t border-[#333]">
                    <h3 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4">Derniers bilans</h3>
                    <div id="rehab-history-list" class="space-y-3"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 w-full bg-[#121212]/95 backdrop-blur-lg border-t border-[#222] pb-safe z-50">
        <div class="flex justify-around items-center h-20 px-2 pb-2">
            <button onclick="switchTab('workout')" id="tab-workout" class="nav-item active flex flex-col items-center p-2 w-20 transition text-slate-400">
                <span class="text-2xl mb-1">🏋️</span>
                <span class="text-[10px] font-bold uppercase tracking-wider">Séance</span>
            </button>
            <button onclick="switchTab('plan')" id="tab-plan" class="nav-item flex flex-col items-center p-2 w-20 transition text-slate-400">
                <span class="text-2xl mb-1">🗓️</span>
                <span class="text-[10px] font-bold uppercase tracking-wider">Plan</span>
            </button>
            <button onclick="switchTab('progress')" id="tab-progress" class="nav-item flex flex-col items-center p-2 w-20 transition text-slate-400">
                <span class="text-2xl mb-1">📈</span>
                <span class="text-[10px] font-bold uppercase tracking-wider">Progrès</span>
            </button>
            <button onclick="switchTab('rehab')" id="tab-rehab" class="nav-item hidden flex flex-col items-center p-2 w-20 transition text-slate-400">
                <span class="text-2xl mb-1">🩹</span>
                <span class="text-[10px] font-bold uppercase tracking-wider">Rehab</span>
            </button>
        </div>
    </nav>

    <!-- Firebase & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, addDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvtimU38lzUYpZhHkkt4WNPwlI-SjGvpM",
            authDomain: "gymxmas2026.firebaseapp.com",
            projectId: "gymxmas2026",
            storageBucket: "gymxmas2026.firebasestorage.app",
            messagingSenderId: "624713032080",
            appId: "1:624713032080:web:3a5c9a4a4f47d228169315",
            measurementId: "G-45ZERHMLXH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        
        provider.setCustomParameters({ prompt: 'select_account' });

        let currentUser = null;
        let isMimi = false;
        let allLogs = [];
        let customExercises = [];
        
        let currentWeekStartDate = new Date();
        let weekPlansData = {}; 
        let selectedPlanDateStr = null; 
        let chartInstance = null;
        let todayPlannedExercises = [];
        window.forceShowInput = {}; // Tracker pour forcer l'affichage de l'input

        // --- PLAN DE MIMI ---
        const mimiPlanData = [
            [   // Lundi
                {name: "Chest-supported row", sets: "3", reps: "8–12"}, 
                {name: "Seated lat pulldown", sets: "3", reps: "8–12"}, 
                {name: "Seated incline dumbbell curls", sets: "3", reps: "10–12"}, 
                {name: "Seated hammer curls", sets: "2", reps: "10–15"}, 
                {name: "Scapular pull-ups / dead hangs", sets: "2", reps: "10–15"}, 
                {name: "Assisted pull-ups / negatives", sets: "2", reps: "10–15"}, 
                {name: "Extra pulldown variation", sets: "2", reps: "10–15"}
            ],
            [   // Mardi
                {name: "Seated chest press", sets: "3", reps: "8–12"}, 
                {name: "Lying chest fly", sets: "2", reps: "10–15"}, 
                {name: "Seated DB shoulder press", sets: "3", reps: "8–12"}, 
                {name: "Seated lateral raises", sets: "3", reps: "12–20"}, 
                {name: "Seated overhead triceps extension", sets: "3", reps: "10–15"}, 
                {name: "Seated triceps pushdown", sets: "2", reps: "10–15"}, 
                {name: "Supine dead bug", sets: "2", reps: "6-10/side"}, 
                {name: "Side plank", sets: "2", reps: "30s"}
            ],
            [   // Jeudi
                {name: "Banded donkey kicks", sets: "3", reps: "12–15/s"}, 
                {name: "Side-lying clamshells", sets: "3", reps: "15–20/s"}, 
                {name: "Prone leg curl machine", sets: "3", reps: "10–15"}, 
                {name: "Seated leg extension", sets: "3", reps: "10–15"}, 
                {name: "Seated hip abductor machine", sets: "3", reps: "12–20"}, 
                {name: "Seated hip adductor machine", sets: "3", reps: "12–15"}, 
                {name: "Single-leg glute bridge", sets: "3", reps: "12–15"}, 
                {name: "Supine dead bug", sets: "4", reps: "30s"}, 
                {name: "Bird dog", sets: "4", reps: "30s"}, 
                {name: "Tabletop toe taps", sets: "4", reps: "30s"}, 
                {name: "Side plank", sets: "4", reps: "30s"}
            ],
            [   // Vendredi
                {name: "Seated neutral-grip lat pulldown", sets: "3", reps: "8–12"}, 
                {name: "Chest-supported row (diff grip)", sets: "3", reps: "8–12"}, 
                {name: "Straight-arm cable pulldown", sets: "2", reps: "8–12"}, 
                {name: "Seated lateral raises", sets: "3", reps: "8–12"}, 
                {name: "Chest-supported rear-delt fly", sets: "3", reps: "8–12"}, 
                {name: "Seated biceps curls", sets: "3", reps: "8–12"}, 
                {name: "Seated triceps extensions", sets: "3", reps: "10–15"}, 
                {name: "Pull-up negatives / push-ups", sets: "3", reps: "10–15"}, 
                {name: "Arnold press", sets: "3", reps: "10–15"}, 
                {name: "Upright row", sets: "3", reps: "10–15"}, 
                {name: "Front raises", sets: "3", reps: "10–15"}, 
                {name: "Around-the-worlds", sets: "3", reps: "10–15"}
            ],
            [   // Samedi
                {name: "Supine dead bugs", sets: "4", reps: "30s"}, 
                {name: "Modified Pilates hundred", sets: "4", reps: "30s"}, 
                {name: "Supine abdominal curl", sets: "4", reps: "30s"}, 
                {name: "Supine abdominal bracing", sets: "4", reps: "30s"}, 
                {name: "Tabletop toe taps", sets: "4", reps: "30s"}, 
                {name: "Side planks / bird dogs", sets: "4", reps: "30s"}, 
                {name: "Bycicle twists", sets: "3", reps: "50"}, 
                {name: "Hanging knee raises", sets: "3", reps: "10-15"}, 
                {name: "DB deadbug", sets: "3", reps: "10-15"}, 
                {name: "Flutter kicks", sets: "3", reps: "10-15"}, 
                {name: "Side plank", sets: "3", reps: "30s"}
            ]
        ];

        window.importMimiPlan = async () => {
            if(!confirm("Mettre à jour les 9 semaines ?\n(Les jours de repos seront Mercredi et Dimanche).")) return;
            
            let d = new Date();
            let day = d.getDay();
            let diff = d.getDate() - day + (day === 0 ? -6 : 1);
            let startMonday = new Date(d.setDate(diff));
            
            const weekMapping = [
                mimiPlanData[0], // Lundi
                mimiPlanData[1], // Mardi
                [],              // Mercredi (Repos)
                mimiPlanData[2], // Jeudi
                mimiPlanData[3], // Vendredi
                mimiPlanData[4], // Samedi
                []               // Dimanche (Repos)
            ];
            
            let count = 0;
            for(let week = 0; week < 9; week++) {
                for(let dayIndex = 0; dayIndex < 7; dayIndex++) {
                    let workoutDate = new Date(startMonday);
                    workoutDate.setDate(workoutDate.getDate() + (week * 7) + dayIndex);
                    
                    let dateStr = getLocalDateStr(workoutDate);
                    let exercises = weekMapping[dayIndex].map(ex => ex.name);
                    
                    await setDoc(doc(db, `users/${currentUser.uid}/plannedWorkouts`, dateStr), {
                        exercises: exercises
                    });
                    count++;
                }
            }
            alert(`Succès ! Les 9 semaines ont été re-générées avec les bons jours de repos.`);
            loadWeekView(); 
            loadTodayWorkout();
        };

        function getExerciseDetails(exName) {
            for (let day of mimiPlanData) {
                const ex = day.find(e => e.name === exName);
                if (ex) return ex;
            }
            return null;
        }

        const categorizedExercises = {
            "🦵 Legs": ["Goblet Squats", "Bulgarian Split Squats", "Leg Extension", "Leg Curl", "Deadlifts", "Banded donkey kicks", "Side-lying clamshells", "Prone leg curl machine", "Seated leg extension", "Seated hip abductor machine", "Seated hip adductor machine", "Single-leg glute bridge"],
            "🔙 Back & Biceps": ["Dead Hangs", "Scapular Pull-ups", "Lat Pulldown", "Biceps Curls", "Australian Rows", "Banded Pull-ups", "Eccentric Pull-ups", "Chest-supported row", "Seated lat pulldown", "Seated incline dumbbell curls", "Seated hammer curls", "Assisted pull-ups / negatives", "Seated neutral-grip lat pulldown", "Straight-arm cable pulldown", "Seated biceps curls"],
            "🦍 Upper Push": ["Dumbbell Bench Press", "Shoulder Press", "Triceps Pushdown", "Pompes", "Lateral Raises", "Dips", "Seated chest press", "Lying chest fly", "Seated DB shoulder press", "Seated overhead triceps extension", "Seated triceps pushdown", "Chest-supported rear-delt fly", "Seated triceps extensions", "Pull-up negatives / push-ups", "Arnold press", "Upright row", "Front raises", "Around-the-worlds"],
            "🍫 Abs & Core": ["Gainage", "Elastique Fessiers", "Supine dead bug", "Side plank", "Bird dog", "Tabletop toe taps", "Supine dead bugs", "Modified Pilates hundred", "Supine abdominal curl", "Supine abdominal bracing", "Side planks / bird dogs", "Bycicle twists", "Hanging knee raises", "DB deadbug", "Flutter kicks"]
        };

        const getLocalDateStr = (d = new Date()) => {
            const offset = d.getTimezoneOffset() * 60000;
            return (new Date(d - offset)).toISOString().split('T')[0];
        };
        
        const options = { weekday: 'long', month: 'long', day: 'numeric' };
        const currentDateString = new Date().toLocaleDateString('fr-FR', options);
        document.getElementById('current-date-display').innerText = currentDateString;
        document.getElementById('rehab-date-display').innerText = currentDateString;

        function getMonday(d) {
            d = new Date(d);
            var day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6:1);
            return new Date(d.setDate(diff));
        }
        currentWeekStartDate = getMonday(new Date());

        // --- AUTH ---
        document.getElementById('btn-login').addEventListener('click', async () => {
            try {
                await setPersistence(auth, browserLocalPersistence);
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert("Erreur de connexion : " + error.message);
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                const rawName = user.displayName ? user.displayName.toLowerCase() : "";
                const cleanName = rawName.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                isMimi = cleanName.includes('mimi') || cleanName.includes('amelie'); 
                
                document.getElementById('user-name').innerText = user.displayName ? user.displayName.split(' ')[0] : "Sportif";
                document.getElementById('btn-login').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                
                if(isMimi) {
                    document.getElementById('tab-rehab').classList.remove('hidden');
                    document.getElementById('mimi-import-section').classList.remove('hidden');
                }
                
                initApp();
            } else {
                currentUser = null;
                document.getElementById('btn-login').classList.remove('hidden');
                document.getElementById('user-info').classList.add('hidden');
                document.getElementById('app-content').classList.add('hidden');
            }
        });

        window.switchTab = (tab) => {
            ['workout', 'plan', 'progress', 'rehab'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('active');
            });
            const titles = { 'workout': 'Aujourd\'hui', 'plan': 'Planning', 'progress': 'Statistiques', 'rehab': 'Rééducation' };
            document.getElementById('header-title').innerText = titles[tab];
            
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('active');
            if(tab === 'progress') renderChart();
            if(tab === 'plan') loadWeekView();
        };

        function initApp() {
            onSnapshot(collection(db, `users/${currentUser.uid}/customExercises`), (snap) => {
                customExercises = [];
                snap.forEach(doc => customExercises.push(doc.data().name));
                updateExerciseDropdowns();
            });

            const logsQuery = query(collection(db, `users/${currentUser.uid}/workoutLogs`), orderBy('ts', 'desc'));
            onSnapshot(logsQuery, (snapshot) => {
                allLogs = [];
                snapshot.forEach(doc => allLogs.push({id: doc.id, ...doc.data()}));
                if(document.getElementById('view-workout').classList.contains('hidden') === false) {
                   renderWorkoutCards();
                }
            });

            const rehabQuery = query(collection(db, `users/${currentUser.uid}/rehabLogs`), orderBy('ts', 'desc'));
            onSnapshot(rehabQuery, (snapshot) => {
                const rehabList = document.getElementById('rehab-history-list');
                if(!rehabList) return;
                rehabList.innerHTML = '';
                let count = 0;
                snapshot.forEach(doc => {
                    if(count > 5) return; 
                    const data = doc.data();
                    if(!data.ts) return;
                    const d = new Date(data.ts.toDate()).toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'short'});
                    rehabList.innerHTML += `
                        <div class="bg-[#1c1c1e] border border-[#333] p-4 rounded-xl">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-white font-bold text-sm capitalize">${d}</span>
                                <div class="flex gap-2 text-[10px] font-black uppercase">
                                    <span class="bg-emerald-900/40 text-emerald-400 px-2 py-1 rounded">Réveil: ${data.painMorning}/10</span>
                                    <span class="bg-orange-900/40 text-orange-400 px-2 py-1 rounded">Activité: ${data.painActivity}/10</span>
                                </div>
                            </div>
                            <p class="text-slate-400 text-xs">${data.notes || 'Aucune note.'}</p>
                        </div>`;
                    count++;
                });
                if(count === 0) rehabList.innerHTML = '<p class="text-xs text-slate-500 italic">Aucun bilan enregistré pour le moment.</p>';
            });

            loadTodayWorkout();
        }

        function updateExerciseDropdowns() {
            const planSelect = document.getElementById('add-ex-select');
            const chartSelect = document.getElementById('chart-exercise-select');
            const todaySelect = document.getElementById('today-add-ex-select');
            
            const currentPlanVal = planSelect?.value;
            const currentChartVal = chartSelect?.value;
            const currentTodayVal = todaySelect?.value;

            if(planSelect) planSelect.innerHTML = ''; 
            if(chartSelect) chartSelect.innerHTML = '';
            if(todaySelect) todaySelect.innerHTML = '';
            
            for (const [category, exercises] of Object.entries(categorizedExercises)) {
                let group1 = document.createElement('optgroup'); group1.label = category;
                let group2 = document.createElement('optgroup'); group2.label = category;
                let group3 = document.createElement('optgroup'); group3.label = category;
                let uniqueEx = [...new Set(exercises)].sort();
                uniqueEx.forEach(ex => {
                    group1.appendChild(new Option(ex, ex));
                    group2.appendChild(new Option(ex, ex));
                    group3.appendChild(new Option(ex, ex));
                });
                if(planSelect) planSelect.appendChild(group1);
                if(chartSelect) chartSelect.appendChild(group2);
                if(todaySelect) todaySelect.appendChild(group3);
            }

            if(customExercises.length > 0) {
                let groupCustom1 = document.createElement('optgroup'); groupCustom1.label = "🛠️ Custom";
                let groupCustom2 = document.createElement('optgroup'); groupCustom2.label = "🛠️ Custom";
                let groupCustom3 = document.createElement('optgroup'); groupCustom3.label = "🛠️ Custom";
                customExercises.sort().forEach(ex => {
                    groupCustom1.appendChild(new Option(ex, ex));
                    groupCustom2.appendChild(new Option(ex, ex));
                    groupCustom3.appendChild(new Option(ex, ex));
                });
                if(planSelect) planSelect.appendChild(groupCustom1);
                if(chartSelect) chartSelect.appendChild(groupCustom2);
                if(todaySelect) todaySelect.appendChild(groupCustom3);
            }

            if(currentPlanVal && planSelect) planSelect.value = currentPlanVal;
            if(currentChartVal && chartSelect) chartSelect.value = currentChartVal;
            if(currentTodayVal && todaySelect) todaySelect.value = currentTodayVal;
        }

        async function loadTodayWorkout() {
            const dateStr = getLocalDateStr();
            const docRef = doc(db, `users/${currentUser.uid}/plannedWorkouts`, dateStr);
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists() && docSnap.data().exercises && docSnap.data().exercises.length > 0) {
                todayPlannedExercises = docSnap.data().exercises;
                document.getElementById('workout-day-title').innerText = "Séance du Jour";
                document.getElementById('workout-status-badge').innerText = `${todayPlannedExercises.length} Exercices`;
                document.getElementById('workout-status-badge').className = "bg-violet-600/20 text-violet-400 border border-violet-500/30 text-xs px-3 py-1 rounded-full font-bold";
            } else {
                todayPlannedExercises = [];
                document.getElementById('workout-day-title').innerText = "Jour de Repos";
                document.getElementById('workout-status-badge').innerText = "Aucun plan";
                document.getElementById('workout-status-badge').className = "bg-slate-800 text-slate-400 text-xs px-3 py-1 rounded-full font-bold";
            }
            renderWorkoutCards();
        }

        window.addExerciseToToday = async () => {
            const ex = document.getElementById('today-add-ex-select').value;
            if(!ex) return;
            if(!todayPlannedExercises.includes(ex)) {
                todayPlannedExercises.push(ex);
                const dateStr = getLocalDateStr();
                await setDoc(doc(db, `users/${currentUser.uid}/plannedWorkouts`, dateStr), {
                    exercises: todayPlannedExercises
                }, { merge: true });
                loadTodayWorkout();
            }
        };

        window.removeExerciseFromToday = async (exName) => {
            if(!confirm(`Retirer ${exName} de la séance d'aujourd'hui ?\n(Cela supprimera aussi les séries que tu as déjà enregistrées pour cet exo aujourd'hui)`)) return;
            
            // Retirer du plan du jour
            todayPlannedExercises = todayPlannedExercises.filter(e => e !== exName);
            const dateStr = getLocalDateStr();
            await setDoc(doc(db, `users/${currentUser.uid}/plannedWorkouts`, dateStr), {
                exercises: todayPlannedExercises
            }, { merge: true });
            
            // Supprimer toutes les logs du jour pour cet exo (pour qu'il disparaisse complètement de l'écran)
            const todayStr = new Date().toDateString();
            const logsToDelete = allLogs.filter(l => l.exercise === exName && l.ts && new Date(l.ts.toDate()).toDateString() === todayStr);
            
            for (let log of logsToDelete) {
                await deleteDoc(doc(db, `users/${currentUser.uid}/workoutLogs`, log.id));
            }
            
            loadTodayWorkout();
        };

        window.deleteLog = async (logId) => {
            if(confirm("Supprimer cette série ?")) {
                await deleteDoc(doc(db, `users/${currentUser.uid}/workoutLogs`, logId));
            }
        };

        window.forceInputShow = (safeName) => {
            window.forceShowInput[safeName] = true;
            renderWorkoutCards();
        };

        function renderWorkoutCards() {
            const container = document.getElementById('workout-exercises-container');
            container.innerHTML = '';
            
            const todayStr = new Date().toDateString();
            const todayLogs = allLogs.filter(l => l.ts && new Date(l.ts.toDate()).toDateString() === todayStr);

            let exercisesToShow = [...todayPlannedExercises];
            let loggedExNames = [...new Set(todayLogs.map(l => l.exercise))];
            loggedExNames.forEach(ex => {
                if(!exercisesToShow.includes(ex)) exercisesToShow.push(ex);
            });

            if(exercisesToShow.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10">
                        <span class="text-5xl block mb-4">🛋️</span>
                        <p class="text-slate-400 font-medium">Rien de prévu aujourd'hui.</p>
                    </div>`;
                return;
            }

            exercisesToShow.forEach((exName, exIndex) => {
                const exLogs = todayLogs.filter(l => l.exercise === exName).reverse(); 
                const lastPerfLog = allLogs.find(l => l.exercise === exName && new Date(l.ts?.toDate()).toDateString() !== todayStr);
                const safeName = exName.replace(/'/g, "\\'");
                
                const card = document.createElement('div');
                card.className = "exercise-card";
                
                const details = getExerciseDetails(exName);
                const targetSets = details ? parseInt(details.sets) : 0;
                let planHTML = details ? `<span class="text-xs font-bold text-violet-400 bg-violet-900/30 px-2 py-1 rounded-md ml-2">${details.sets} Sets &times; ${details.reps}</span>` : '';
                
                let perfHTML = lastPerfLog 
                    ? `<div class="text-xs font-semibold text-slate-400 mt-1">Dernière perf: <span class="text-white">${lastPerfLog.weight}kg &times; ${lastPerfLog.reps}</span></div>` 
                    : '';
                
                let html = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <div class="flex items-center">
                                <h3 class="font-black text-lg text-white leading-tight">${exName}</h3>
                                ${planHTML}
                            </div>
                            ${perfHTML}
                        </div>
                        <button onclick="removeExerciseFromToday('${safeName}')" class="text-slate-500 hover:text-red-500 px-2 text-2xl leading-none">&times;</button>
                    </div>
                    
                    <div class="space-y-2 mb-4">
                        <div class="grid grid-columns-5 gap-2 px-1 mb-1 set-row" style="opacity: 0.5;">
                            <div class="text-[10px] font-bold uppercase tracking-wider text-center">Set</div>
                            <div class="text-[10px] font-bold uppercase tracking-wider text-center">Reps</div>
                            <div></div>
                            <div class="text-[10px] font-bold uppercase tracking-wider text-center">Kgs</div>
                            <div></div>
                        </div>
                `;

                exLogs.forEach((log, idx) => {
                    html += `
                        <div class="set-row bg-[#121212] rounded-xl px-2 py-2 border border-[#333]">
                            <div class="w-6 h-6 rounded-full bg-violet-600/30 text-violet-400 flex items-center justify-center text-xs font-black mx-auto">${idx + 1}</div>
                            <div class="text-center font-black text-white text-lg">${log.reps}</div>
                            <div class="text-slate-600 text-xs font-bold text-center">&times;</div>
                            <div class="text-center font-black text-white text-lg">${log.weight}</div>
                            <div class="flex justify-end items-center gap-2">
                                <span class="text-emerald-400 text-lg">✔</span>
                                <button onclick="deleteLog('${log.id}')" class="text-slate-500 hover:text-red-500 text-xl font-black">&times;</button>
                            </div>
                        </div>
                    `;
                });

                const nextSetNum = exLogs.length + 1;
                let suggestedWeight = exLogs.length > 0 ? exLogs[exLogs.length-1].weight : (lastPerfLog ? lastPerfLog.weight : '');
                let suggestedReps = exLogs.length > 0 ? exLogs[exLogs.length-1].reps : (lastPerfLog ? lastPerfLog.reps : '');
                
                const isGoalReached = targetSets > 0 && exLogs.length >= targetSets;
                const isForceShow = window.forceShowInput[exName] === true;

                if (!isGoalReached || isForceShow) {
                    html += `
                            <div class="set-row">
                                <div class="w-6 h-6 rounded-full bg-[#333] text-slate-400 flex items-center justify-center text-xs font-black mx-auto">${nextSetNum}</div>
                                <div><input type="number" inputmode="numeric" id="reps-${exIndex}" class="log-input text-lg" value="${suggestedReps}" placeholder="0"></div>
                                <div class="text-slate-600 text-xs font-bold text-center">&times;</div>
                                <div><input type="number" inputmode="decimal" id="weight-${exIndex}" class="log-input text-lg" value="${suggestedWeight}" placeholder="0"></div>
                                <button onclick="saveSpecificSet('${safeName}', ${exIndex})" class="bg-[#2c2c2e] hover:bg-violet-600 text-white font-bold text-xs py-2 rounded-xl transition w-full shadow-md border border-[#444]">SAVE</button>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                            <div class="mt-4 p-3 bg-emerald-900/20 border border-emerald-500/20 rounded-xl text-center">
                                <div class="text-emerald-400 font-black mb-2 flex justify-center items-center gap-2"><span>✅</span> Objectif Atteint !</div>
                                <button onclick="forceInputShow('${safeName}')" class="text-[10px] uppercase font-bold text-slate-400 hover:text-white underline">Ajouter une série supplémentaire</button>
                            </div>
                        </div>
                    `;
                }
                
                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        window.saveSpecificSet = async (exName, index) => {
            const repsInput = document.getElementById(`reps-${index}`);
            const weightInput = document.getElementById(`weight-${index}`);
            
            const reps = parseInt(repsInput.value) || 0;
            const weight = parseFloat(weightInput.value) || 0;

            if (reps === 0) {
                repsInput.classList.add('border-red-500');
                setTimeout(() => repsInput.classList.remove('border-red-500'), 1000);
                return;
            }

            try {
                // Rénitialise l'affichage forcé de l'input pour fermer la boucle après l'ajout d'une série extra
                window.forceShowInput[exName] = false;
                
                await addDoc(collection(db, `users/${currentUser.uid}/workoutLogs`), {
                    exercise: exName, weight, reps, ts: serverTimestamp()
                });
            } catch (e) { 
                alert("Erreur d'enregistrement."); 
            }
        };

        // --- PLANNING : VUE SEMAINE ---
        window.changeWeek = (offset) => {
            currentWeekStartDate.setDate(currentWeekStartDate.getDate() + (offset * 7));
            closeDayEditor();
            loadWeekView();
        };

        window.loadWeekView = async () => {
            const weekEnd = new Date(currentWeekStartDate);
            weekEnd.setDate(weekEnd.getDate() + 6);
            
            const startStr = currentWeekStartDate.toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'});
            const endStr = weekEnd.toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'});
            document.getElementById('week-label').innerText = `${startStr} - ${endStr}`;

            const grid = document.getElementById('week-grid');
            grid.innerHTML = '<div class="w-full text-center text-sm text-slate-500 py-4">Chargement...</div>';

            const days = ["LUN", "MAR", "MER", "JEU", "VEN", "SAM", "DIM"];
            weekPlansData = {};

            for(let i = 0; i < 7; i++) {
                let d = new Date(currentWeekStartDate);
                d.setDate(d.getDate() + i);
                let dStr = getLocalDateStr(d);
                
                const docSnap = await getDoc(doc(db, `users/${currentUser.uid}/plannedWorkouts`, dStr));
                if (docSnap.exists() && docSnap.data().exercises) {
                    weekPlansData[dStr] = docSnap.data().exercises;
                } else {
                    weekPlansData[dStr] = [];
                }
            }

            grid.innerHTML = '';
            const todayStr = getLocalDateStr(new Date());

            for(let i = 0; i < 7; i++) {
                let d = new Date(currentWeekStartDate);
                d.setDate(d.getDate() + i);
                let dStr = getLocalDateStr(d);
                
                const nbEx = weekPlansData[dStr].length;
                const isToday = (dStr === todayStr);
                
                const card = document.createElement('div');
                card.onclick = () => openDayEditor(dStr, days[i], d.getDate());
                card.className = `min-w-[70px] snap-center p-3 rounded-[1rem] cursor-pointer transition flex flex-col items-center justify-center text-center
                    ${isToday ? 'bg-violet-600 shadow-lg shadow-violet-900/50' : 'bg-[#121212] border border-[#333] hover:border-violet-500'}`;
                
                card.innerHTML = `
                    <span class="text-[10px] font-black ${isToday ? 'text-violet-200' : 'text-slate-500'} tracking-wider">${days[i]}</span>
                    <span class="text-xl font-black ${isToday ? 'text-white' : 'text-slate-300'} my-1">${d.getDate()}</span>
                    <div class="w-2 h-2 rounded-full ${nbEx > 0 ? (isToday ? 'bg-white' : 'bg-violet-500') : 'bg-transparent'}"></div>
                `;
                
                grid.appendChild(card);
            }
        };

        window.openDayEditor = (dateStr, dayName, dayNum) => {
            selectedPlanDateStr = dateStr;
            document.getElementById('editor-date-label').innerText = `Édition : ${dayName} ${dayNum}`;
            document.getElementById('shift-date').value = dateStr; 
            document.getElementById('day-editor').classList.remove('hidden');
            setTimeout(() => document.getElementById('day-editor').scrollIntoView({behavior: "smooth", block: "nearest"}), 100);
            renderEditorList();
        };

        window.closeDayEditor = () => {
            document.getElementById('day-editor').classList.add('hidden');
            selectedPlanDateStr = null;
        };

        function renderEditorList() {
            const container = document.getElementById('planned-exercises-list');
            container.innerHTML = '';
            const exos = weekPlansData[selectedPlanDateStr] || [];
            if(exos.length === 0) {
                container.innerHTML = '<span class="text-slate-500 text-xs italic">Aucun exercice prévu ce jour.</span>';
            } else {
                exos.forEach((ex, idx) => {
                    const details = getExerciseDetails(ex);
                    let infoHTML = details ? `<div class="text-[10px] text-slate-400 font-bold mt-1 tracking-wider">${details.sets} SETS &times; ${details.reps}</div>` : '';

                    const div = document.createElement('div');
                    div.className = "flex justify-between items-center bg-[#1c1c1e] p-3 rounded-xl border border-[#333]";
                    div.innerHTML = `
                        <div>
                            <div class="text-sm font-semibold text-slate-200">${ex}</div>
                            ${infoHTML}
                        </div>
                        <button onclick="removeExerciseFromPlan(${idx})" class="text-slate-500 hover:text-red-400 text-2xl leading-none">&times;</button>
                    `;
                    container.appendChild(div);
                });
            }
        }

        window.addExerciseToPlan = async () => {
            const ex = document.getElementById('add-ex-select').value;
            if(!ex || !selectedPlanDateStr) return;
            if(!weekPlansData[selectedPlanDateStr]) weekPlansData[selectedPlanDateStr] = [];
            weekPlansData[selectedPlanDateStr].push(ex);
            await savePlanToDB(selectedPlanDateStr, weekPlansData[selectedPlanDateStr]);
            renderEditorList();
            loadWeekView(); 
        };

        window.removeExerciseFromPlan = async (idx) => {
            weekPlansData[selectedPlanDateStr].splice(idx, 1);
            await savePlanToDB(selectedPlanDateStr, weekPlansData[selectedPlanDateStr]);
            renderEditorList();
            loadWeekView();
        };

        async function savePlanToDB(dateStr, exosArr) {
            await setDoc(doc(db, `users/${currentUser.uid}/plannedWorkouts`, dateStr), { exercises: exosArr }, { merge: true });
            if(dateStr === getLocalDateStr()) loadTodayWorkout();
        }

        window.shiftWorkout = async () => {
            const targetDateStr = document.getElementById('shift-date').value;
            if(!targetDateStr || targetDateStr === selectedPlanDateStr) return;
            
            const exosToMove = weekPlansData[selectedPlanDateStr] || [];
            if(exosToMove.length === 0) return alert("Rien à décaler ce jour-là.");

            if(confirm(`Déplacer ces ${exosToMove.length} exercices au ${targetDateStr} ?`)) {
                try {
                    await setDoc(doc(db, `users/${currentUser.uid}/plannedWorkouts`, targetDateStr), { exercises: exosToMove }, { merge: true });
                    await deleteDoc(doc(db, `users/${currentUser.uid}/plannedWorkouts`, selectedPlanDateStr));
                    
                    weekPlansData[selectedPlanDateStr] = []; 
                    closeDayEditor();
                    loadWeekView(); 
                    if(selectedPlanDateStr === getLocalDateStr() || targetDateStr === getLocalDateStr()) loadTodayWorkout();
                } catch(e) {
                    alert("Erreur lors du décalage.");
                }
            }
        };

        window.saveRehab = async () => {
            const morning = parseInt(document.getElementById('pain-morning').value);
            const activity = parseInt(document.getElementById('pain-activity').value);
            const notes = document.getElementById('rehab-notes').value;

            try {
                await addDoc(collection(db, `users/${currentUser.uid}/rehabLogs`), {
                    painMorning: morning, painActivity: activity, notes, ts: serverTimestamp()
                });
                document.getElementById('rehab-notes').value = '';
            } catch (e) { alert("Erreur d'enregistrement."); }
        };

        window.renderChart = () => {
            const ctx = document.getElementById('progression-chart').getContext('2d');
            const selectedEx = document.getElementById('chart-exercise-select').value;
            if(!selectedEx) return;
            
            const exLogs = allLogs.filter(l => l.exercise === selectedEx && l.ts);
            
            const maxPerDay = {};
            exLogs.forEach(log => {
                const d = new Date(log.ts.toDate()).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
                if(!maxPerDay[d] || log.weight > maxPerDay[d]) maxPerDay[d] = log.weight;
            });

            const sortedDates = Object.keys(maxPerDay).reverse();
            const dataWeights = sortedDates.map(d => maxPerDay[d]);

            if (chartInstance) chartInstance.destroy();

            Chart.defaults.color = '#94a3b8';
            Chart.defaults.font.family = 'Inter';

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sortedDates,
                    datasets: [{
                        label: 'Max Poids (kg)',
                        data: dataWeights,
                        borderColor: '#8b5cf6',
                        backgroundColor: 'rgba(139, 92, 246, 0.1)',
                        borderWidth: 4,
                        pointRadius: 6,
                        pointBackgroundColor: '#121212',
                        pointBorderColor: '#8b5cf6',
                        pointBorderWidth: 2,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: '#333' }, border: { dash: [4, 4] } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        };
    </script>
</body>
</html>
